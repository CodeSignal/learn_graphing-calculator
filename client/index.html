<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>CodeSignal CosmoPlot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Fonts (Work Sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Design System Foundations -->
  <link rel="stylesheet" href="./design-system/colors/colors.css">
  <link rel="stylesheet" href="./design-system/spacing/spacing.css">
  <link rel="stylesheet" href="./design-system/typography/typography.css">

  <!-- Design System Components -->
  <link rel="stylesheet" href="./design-system/components/button/button.css">
  <link rel="stylesheet" href="./design-system/components/boxes/boxes.css">
  <link rel="stylesheet" href="./design-system/components/input/input.css">
  <link rel="stylesheet" href="./design-system/components/numeric-slider/numeric-slider.css">
  <link rel="stylesheet" href="./design-system/components/dropdown/dropdown.css">
  <link rel="stylesheet" href="./design-system/components/tags/tags.css">
  <link rel="stylesheet" href="./design-system/components/modal/modal.css">
  <link rel="stylesheet" href="./design-system/components/icons/icons.css">

  <!-- KaTeX for LaTeX rendering -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
    crossorigin="anonymous">

  <!-- Application-specific styles -->
  <link rel="stylesheet" href="./app.css">
</head>

<body class="bespoke">
  <!-- Navigation Header -->
  <header class="header">
    <h1 class="heading-small">CodeSignal CosmoPlot</h1>
    <div class="spacer"></div>
    <button id="btn-help" class="button button-text">Help</button>
  </header>

  <!-- Main Application Content -->
  <main class="main-layout" style="overflow: hidden;"> <!-- Prevent scrolling on main layout -->
    <aside id="sidebar" class="sidebar" style="width: 300px;">
      <!-- Sidebar Header -->
      <header class="sidebar-header">
        <div class="sidebar-tabs" role="tablist" aria-label="Sidebar sections">
          <button
            id="tab-expressions"
            class="button button-secondary sidebar-tab is-active"
            type="button"
            role="tab"
            aria-label="Expressions"
            aria-selected="true"
            title="Expressions">
            <span class="sidebar-tab-label" data-fallback="f(x)">f(x)</span>
          </button>
          <button
            id="tab-parameters"
            class="button button-tertiary sidebar-tab"
            type="button"
            role="tab"
            aria-label="Parameters"
            aria-selected="false"
            title="Parameters">
            <span class="sidebar-tab-label" data-fallback="θ">θ</span>
          </button>
        </div>
        <button
          id="btn-toggle-sidebar"
          class="button button-secondary sidebar-toggle-btn"
          aria-label="Toggle sidebar">
          &lt;&lt;
        </button>
      </header>

      <!-- Expression List -->
      <section
        class="sidebar-section"
        style="flex: 1; overflow-y: auto; display: flex;
          flex-direction: column;">
        <div id="expression-list" style="flex: 1; overflow-y: auto;">
          <!-- Expressions will be injected here -->
          <button class="button button-tertiary" id="btn-add-expression"
            style="width: 100%; margin-top: var(--UI-Spacing-spacing-m);">
            + Add Expression
          </button>
        </div>
      </section>

    </aside>
    <div id="sidebar-resizer" class="sidebar-resizer"></div>

    <!-- Floating Toggle Button (shown when sidebar is collapsed) -->
    <button
      id="btn-floating-toggle-sidebar"
      class="button button-secondary sidebar-floating-toggle"
      aria-label="Show sidebar">
      &gt;&gt;
    </button>

    <div class="content-area" style="padding: 0; position: relative;">
      <!-- Toolbar for Graph -->
      <div
        id="graph-toolbar"
        style="position: absolute; top: 1rem; right: 1rem;
          z-index: 10; display: flex; gap: 0.5rem;">
        <button class="button button-secondary" id="btn-home" aria-label="Reset View">⟲</button>
        <button class="button button-secondary" id="btn-zoom-in" aria-label="Zoom In">+</button>
        <button class="button button-secondary" id="btn-zoom-out" aria-label="Zoom Out">-</button>
      </div>

      <div id="graph-canvas" style="width: 100%; height: 100%; display: block;"></div>
    </div>
  </main>

  <!-- Help Content Template (Hidden); keep aligned with line-classifier + UI -->
  <template id="help-content">
    <nav class="toc">
      <strong>Contents</strong>
      <ul>
        <li><a href="#overview">Overview</a></li>
        <li><a href="#expression-syntax">Expression syntax</a></li>
        <li><a href="#parameters">Parameters</a></li>
        <li><a href="#working-with-rows">Working with rows</a></li>
        <li><a href="#graph-controls">Graph controls</a></li>
        <li><a href="#limitations">Limitations</a></li>
        <li><a href="#shortcuts">Shortcuts</a></li>
      </ul>
    </nav>

    <section id="overview">
      <h2>Overview</h2>
      <p>
        CodeSignal CosmoPlot graphs math you type in the sidebar. The sidebar has
        two tabs: <strong>f(x)</strong> for things that draw on the plot, and
        <strong>θ</strong> (parameters) for numeric assignments and sliders.
      </p>
      <p>
        Most graph lines need <code>x</code> (and sometimes <code>y</code>) as
        described below. The plot updates as you type; some sidebar behavior
        (like parameter detection) finishes when you leave the field
        (<kbd>Enter</kbd> or click away).
      </p>
    </section>

    <section id="expression-syntax">
      <h2>Expression syntax</h2>
      <p>Each line is classified; only valid <strong>graph</strong> lines plot.</p>

      <h3>Explicit <code>y = f(x)</code></h3>
      <ul>
        <li><code>sin(x)</code>, <code>x^2 + 5</code> — treated like <code>y = …</code></li>
        <li><code>y = a * x + 1</code> — standard function form</li>
        <li>
          <code>f(x) = x^2</code> — function definition; only <code>f(x)</code>
          with parameter <code>x</code> is supported; the plotted curve uses the
          body (same as <code>y = …</code>).
        </li>
      </ul>

      <h3>Implicit equations</h3>
      <ul>
        <li><code>x^2 + y^2 = 1</code> — relation in <code>x</code> and <code>y</code></li>
        <li><code>x = y^2</code> — vertical parabola (no <code>x</code> on the RHS)</li>
      </ul>

      <h3>Inequalities (region + boundary)</h3>
      <p>
        One comparator only: <code>&lt;</code>, <code>&lt;=</code>, <code>&gt;</code>,
        or <code>&gt;=</code>. The expression must involve <code>x</code> or
        <code>y</code>. Example: <code>x^2 + y^2 &lt; 1</code>. Strict inequalities
        use a dashed boundary; inclusive use a solid boundary.
      </p>
      <p>Chained comparisons like <code>-1 &lt; x &lt; 1</code> are not supported.</p>

      <h3>Points (scatter)</h3>
      <p>
        <code>points([[xExpr, yExpr], …])</code> — each pair is a string
        expression evaluated with your parameters. Do not use <code>x</code> or
        <code>y</code> inside those coordinate strings. Example:
        <code>points([[0, 0], [1, 2], [a, b]])</code>.
      </p>

      <h3>Vectors</h3>
      <p>
        <code>vector([vx, vy])</code> or <code>vector([vx, vy], [ox, oy])</code> —
        same coordinate rules as points (no <code>x</code>/<code>y</code> in
        components). <code>points</code> and <code>vector</code> are built-in syntax,
        not parameter names.
      </p>
    </section>

    <section id="parameters">
      <h2>Parameters</h2>
      <p>
        Symbols in graph lines besides <code>x</code> and <code>y</code> are treated
        as parameters. CosmoPlot ensures each has a slider row: if there is no
        assignment yet, it may add <code>name = 1.0</code> in the θ tab.
      </p>
      <p>
        Parameter detection can run after you commit text (blur/<kbd>Enter</kbd>)
        and is skipped while an expression input is focused, so the list stays
        stable while typing.
      </p>
      <ul>
        <li>
          <strong>θ tab</strong> — assignment lines like <code>a = 1</code> or
          <code>b = pi</code>; RHS must evaluate to a finite number (no
          <code>x</code>/<code>y</code> on the RHS).
        </li>
        <li>
          <strong>+ Add Parameter</strong> — opens a name composer; names match
          <code>[A-Za-z_][A-Za-z0-9_]*</code>, cannot be <code>x</code> or
          <code>y</code>, and cannot duplicate an existing parameter name.
        </li>
        <li>
          Sliders support value, min, max, and step; changing the plotted value
          redraws the graph. Dragging updates the plot; logging follows commit-style
          rules (not every intermediate tick).
        </li>
        <li>Example graph with parameters: <code>a * sin(b * x)</code>.</li>
      </ul>
    </section>

    <section id="working-with-rows">
      <h2>Working with rows</h2>
      <ul>
        <li>Click the rendered math to edit; the raw text field appears.</li>
        <li>Graph updates live while typing; blur or <kbd>Enter</kbd> commits.</li>
        <li>
          While editing, transient “syntax error” may be hidden until commit so
          partial input is not noisy.
        </li>
        <li>Color chip toggles visibility (dimmed row + hidden from plot).</li>
        <li>Trash deletes the row.</li>
        <li>
          Tab filter: graph-intent rows show under <strong>f(x)</strong>;
          assignment-intent rows under <strong>θ</strong>; regrouping follows
          commit.
        </li>
      </ul>
    </section>

    <section id="graph-controls">
      <h2>Graph controls</h2>
      <ul>
        <li><strong>Drag</strong> on the plot — pan.</li>
        <li><strong>Scroll wheel</strong> — zoom in/out.</li>
        <li>
          Toolbar <strong>+</strong> / <strong>-</strong> — zoom by fixed factors
          around the view center.
        </li>
        <li>
          <strong>⟲</strong> — reset viewport to the initial graph from the loaded
          configuration.
        </li>
        <li>
          <strong>Square units</strong> — X and Y use equal math-units per pixel
          (aspect lock). On resize, the shorter axis range expands so nothing is
          cropped; stored bounds may differ slightly from the drawn box.
        </li>
        <li>
          <strong>Tooltip</strong> — on a plottable curve, hover shows
          <code>id: (x, y)</code> with coordinates to three decimals. Inequality
          boundaries do not show curve tips.
        </li>
        <li>
          Grid on/off comes from the loaded config (<code>graph.showGrid</code>),
          not from an in-app toggle in the default UI.
        </li>
      </ul>
      <p>
        Sidebar width: drag the resizer; use collapse buttons or the floating
        control to show the sidebar again.
      </p>
    </section>

    <section id="limitations">
      <h2>Limitations</h2>
      <ul>
        <li>Parametric curves <code>(x(t), y(t))</code> are not supported.</li>
        <li>
          Function definitions must be <code>f(x) = expr</code> with that exact
          parameter; e.g. <code>f(t) = …</code> or <code>f(x,y) = …</code> is invalid.
        </li>
        <li><code>y</code> must appear on the left for <code>y = …</code> forms.</li>
        <li>
          Points/vector coordinate expressions cannot reference <code>x</code> or
          <code>y</code>.
        </li>
        <li>
          Reference lines, derivative overlays, and secants are configuration-only
          in this build, not created from the sidebar.
        </li>
      </ul>
    </section>

    <section id="shortcuts">
      <h2>Shortcuts</h2>
      <ul>
        <li><kbd>Esc</kbd> — close this help modal (also close via overlay/footer).</li>
        <li><kbd>Enter</kbd> — commit expression when the input is focused.</li>
      </ul>
    </section>
  </template>

  <!-- Core Scripts -->
  <script type="module" src="./app.js"></script>
</body>

</html>
